name: Reportar un bug
description: Reporta un problema reproducible o comportamiento inesperado.
title: "[Bug]: "
labels: []
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar el problema. No publiques vulnerabilidades ni
        credenciales; utiliza el canal privado definido en SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Explica el problema de forma clara y concreta.
      placeholder: ¿Qué está fallando y a quién afecta?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno y versión
      placeholder: Staging, commit, versión, navegador, OS o dispositivo.
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Precondiciones
      placeholder: Estado necesario antes de reproducir el problema.
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Frecuencia
      options: [Siempre, Frecuente, Intermitente, Una sola vez]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options: [Backend, Frontend, Mobile, Infrastructure, QA, Product, Security, Unknown]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Describe usuarios, operaciones o datos afectados.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia sanitizada
      description: No incluyas secretos, tokens, datos personales ni información sensible.
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Incluye la regresión que debería proteger la corrección.
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Verificación
      options:
        - label: Busqué Issues existentes y no encontré un duplicado.
          required: true
        - label: Eliminé secretos y datos sensibles del reporte.
          required: true
        - label: Esto no es una vulnerabilidad que requiera reporte privado.
          required: true
