name: Proponer una funcionalidad
description: Propón una capacidad o mejora explicando primero el problema.
title: "[Feature]: "
labels: []
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Quién está afectado, qué necesita y por qué importa?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Valor para usuarios o negocio
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance propuesto
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fuera de alcance
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - El usuario puede...
        - El sistema valida...
        - Los errores se muestran...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área principal
      options: [Backend, Frontend, Mobile, Infrastructure, QA, Product, Security, Multiple areas]
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Audiencia
      options: [Customers, Providers, Businesses, Administrators, Internal team, Developers, Multiple audiences]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias y bloqueos
  - type: textarea
    id: risks
    attributes:
      label: Riesgos y seguridad
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Verificación
      options:
        - label: Busqué propuestas equivalentes.
          required: true
        - label: Expliqué el problema, no solamente una implementación preferida.
          required: true
        - label: No incluí secretos ni datos sensibles.
          required: true
