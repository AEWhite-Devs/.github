name: Proponer una investigación
description: Spike limitado para resolver una pregunta técnica o de producto.
title: "[Investigation]: "
labels: [investigation]
body:
  - type: textarea
    id: question
    attributes:
      label: Pregunta que debe responderse
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto y evidencia disponible
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Límite de tiempo
      placeholder: "Ejemplo: 2 días"
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Entregable esperado
      placeholder: Recomendación, PoC descartable, métricas o ADR.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Fuera de alcance
    validations:
      required: true
